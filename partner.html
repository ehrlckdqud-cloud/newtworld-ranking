<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>뉴트월드 제휴샵 파트너센터</title><meta name="theme-color" content="#071018"><script src="site-config.js"></script><style>
:root{--bg:#071018;--p:#0d1b24;--p2:#122833;--t:#eff8ff;--m:#8da8ba;--l:#244455;--g:#6ce0a6;--c:#55c8ff;--gold:#ffd569}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -5%,rgba(52,96,72,.3),transparent 32%),linear-gradient(#071018,#08151d);color:var(--t);font-family:Inter,system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:1120px;margin:auto;padding:18px}.hero{text-align:center;padding:24px 12px}.hero h1{margin:0;font-size:clamp(28px,5vw,46px)}.hero p{color:var(--m)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{border:1px solid var(--l);border-radius:18px;background:linear-gradient(180deg,#10232d,#0a1720);padding:16px;cursor:pointer}.card:hover{border-color:#57c69c}.card b{font-size:18px}.card span{display:block;color:var(--m);font-size:11px;margin-top:4px}.admin{border-color:#66582a;background:#211d0e}.login,.dash{display:none;margin-top:16px;border:1px solid var(--l);border-radius:18px;background:var(--p);padding:16px}.login.open,.dash.open{display:block}.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1;min-width:220px;background:#081820;color:white;border:1px solid var(--l);border-radius:12px;padding:11px}.btn{border:1px solid #367060;background:#113b34;color:white;border-radius:12px;padding:10px 14px;font-weight:800}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:14px 0}.kpi{border:1px solid var(--l);border-radius:14px;background:#0a1720;padding:12px}.kpi small{color:var(--m)}.kpi strong{display:block;font-size:24px;margin-top:4px}.chart{border:1px solid var(--l);border-radius:16px;padding:12px;background:#09151d;margin-top:12px}.chart svg{width:100%;height:220px}.shopCompare{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.cmp{border:1px solid var(--l);border-radius:14px;padding:12px;background:#0b1820}.note{font-size:11px;color:var(--m);margin-top:10px}@media(max-width:760px){.cards{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr 1fr}.shopCompare{grid-template-columns:1fr}}@media(max-width:460px){.cards{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="hero"><h1>🤝 제휴샵 파트너센터</h1><p>자기 샵 카드 선택 → 비밀번호 인증 → 자기 성과만 확인할 수 있습니다.</p></div><div class="cards" id="cards"></div><div class="login" id="login"><h3 id="loginTitle"></h3><div class="row"><input id="pw" type="password" placeholder="비밀번호"><button class="btn" id="go">로그인</button></div><div class="note" id="msg"></div></div><div class="dash" id="dash"></div><div class="note">※ 클릭은 브라우저/샵/일자 기준 중복을 줄여 집계합니다. 유입은 카카오톡 대화내보내기에서 제휴샵 유입 문구가 확인된 기록 기준입니다. 클릭이 실제 구매를 의미하지는 않습니다.</div></div><script>
const APP=(window.NW_CONFIG&&window.NW_CONFIG.appScriptUrl)||'', $=id=>document.getElementById(id);let selected='',admin=false;function jp(action,p,cb){if(!APP||APP.includes('PASTE_WEB_APP_URL_HERE')){cb({ok:false,error:'사이트 연동 설정이 필요합니다.'});return}const n='p_'+Date.now()+Math.random().toString(36).slice(2);window[n]=d=>{try{cb(d)}finally{delete window[n];document.getElementById(n)?.remove()}};const q=new URLSearchParams({action,callback:n,_:Date.now(),...(p||{})});const s=document.createElement('script');s.id=n;s.src=APP+(APP.includes('?')?'&':'?')+q;document.body.appendChild(s)}async function hash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}function cards(){jp('partnerList',{},d=>{const shops=d.shops||[];$('cards').innerHTML=shops.map(x=>`<div class="card" data-shop="${x.name}"><b>${x.name}</b><span>${x.region}</span><span>🔐 파트너 로그인</span></div>`).join('')+`<div class="card admin" data-admin="1"><b>관리자</b><span>전체 제휴샵 성과 비교</span><span>🔐 관리자 로그인</span></div>`;document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{admin=!!c.dataset.admin;selected=c.dataset.shop||'관리자';$('loginTitle').textContent=selected+' 로그인';$('login').classList.add('open');$('dash').classList.remove('open');$('pw').value='';$('pw').focus();})})}function k(v){return Number(v||0).toLocaleString('ko-KR')}function chart(months){const W=720,H=210,p=28,max=Math.max(1,...months.flatMap(x=>[+x.clicks,+x.referrals]));const bw=(W-p*2)/Math.max(1,months.length),bars=months.map((x,i)=>{const h1=(+x.clicks/max)*(H-70),h2=(+x.referrals/max)*(H-70),x0=p+i*bw;return`<rect x="${x0+5}" y="${H-35-h1}" width="${Math.max(7,bw*.32)}" height="${h1}" rx="3" fill="#55c8ff"/><rect x="${x0+8+bw*.34}" y="${H-35-h2}" width="${Math.max(7,bw*.32)}" height="${h2}" rx="3" fill="#6ce0a6"/><text x="${x0+bw/2}" y="${H-12}" fill="#8da8ba" font-size="10" text-anchor="middle">${x.month.slice(5)}월</text>`}).join('');return`<svg viewBox="0 0 ${W} ${H}" role="img"><text x="28" y="18" fill="#9fc0d0" font-size="11">파랑 클릭 · 초록 유입</text>${bars}</svg>`}function renderShop(d){const x=d.data;$('dash').classList.add('open');$('dash').innerHTML=`<h2>${x.shop} 성과</h2><div class="kpis"><div class="kpi"><small>이번 달 유입</small><strong>${k(x.monthReferrals)}명</strong></div><div class="kpi"><small>누적 유입</small><strong>${k(x.totalReferrals)}명</strong></div><div class="kpi"><small>현재 잔존</small><strong>${k(x.present)}명</strong></div><div class="kpi"><small>잔존율</small><strong>${x.retention}%</strong></div><div class="kpi"><small>이번 달 클릭</small><strong>${k(x.monthClicks)}</strong></div><div class="kpi"><small>누적 클릭</small><strong>${k(x.totalClicks)}</strong></div><div class="kpi"><small>이탈</small><strong>${k(x.departed)}명</strong></div></div><div class="chart"><h3>최근 6개월 추이</h3>${chart(x.months)}</div>`}function renderAdmin(d){$('dash').classList.add('open');$('dash').innerHTML=`<h2>관리자 · 전체 제휴샵 비교</h2><div class="shopCompare">${d.shops.map(x=>`<div class="cmp"><b>${x.shop}</b><div>유입 ${k(x.totalReferrals)} · 잔존 ${k(x.present)} · 잔존율 ${x.retention}% · 클릭 ${k(x.totalClicks)}</div></div>`).join('')}</div>`}async function login(){const pw=$('pw').value;if(!pw)return;const h=await hash(pw);$('msg').textContent='확인 중…';jp(admin?'adminLogin':'partnerLogin',admin?{hash:h}:{shop:selected,hash:h},d=>{if(!d.ok){$('msg').textContent=d.error||'로그인 실패';return}$('msg').textContent='로그인 완료';sessionStorage.setItem(admin?'nwAdminToken':'nwPartnerToken',d.token);jp(admin?'adminPartnerData':'partnerData',{token:d.token},x=>{if(!x.ok){$('msg').textContent=x.error||'데이터 불러오기 실패';return}admin?renderAdmin(x):renderShop(x)})})}$('go').onclick=login;$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});cards();</script></body></html>
