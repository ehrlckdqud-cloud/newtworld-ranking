<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>뉴트월드 제휴샵 파트너센터</title><meta name="theme-color" content="#071018">
<script src="site-config.js"></script>
<style>
:root{--bg:#071018;--p:#0d1b24;--t:#eff8ff;--m:#9bb2c2;--l:#244455;--g:#6ce0a6;--c:#55c8ff;--gold:#ffd569}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -5%,#3460484d,transparent 32%),linear-gradient(#071018,#08151d);color:var(--t);font-family:Inter,system-ui,-apple-system,"Noto Sans KR",sans-serif}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1120px;margin:auto;padding:18px}.hero{text-align:center;padding:24px 12px}.hero h1{margin:0;font-size:clamp(26px,5vw,44px)}.hero p{color:var(--m);line-height:1.6}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.card{color:var(--t);text-align:left;border:1px solid var(--l);border-radius:18px;background:linear-gradient(180deg,#10232d,#0a1720);padding:16px;transition:transform .2s,border-color .2s}.card:hover{border-color:#57c69c;transform:translateY(-2px)}.card b{font-size:18px}.card span{display:block;color:var(--m);font-size:12px;margin-top:5px}.admin{border-color:#66582a;background:#211d0e}
.login,.dash{display:none;margin-top:16px;border:1px solid var(--l);border-radius:18px;background:var(--p);padding:18px}.login.open,.dash.open{display:block}.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1;min-width:0;background:#081820;color:white;border:1px solid var(--l);border-radius:12px;padding:11px}.btn{border:1px solid #367060;background:#113b34;color:white;border-radius:12px;padding:10px 14px;font-weight:700}.btn:disabled{opacity:.5;cursor:wait}.dash-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.dash-head h2{margin:4px 0}.dash-head .btn{white-space:nowrap;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:16px 0}.kpi{border:1px solid var(--l);border-radius:14px;background:#0a1720;padding:12px}.kpi small{color:var(--m)}.kpi strong{display:block;font-size:24px;margin-top:4px}.chart{border:1px solid var(--l);border-radius:16px;padding:12px;background:#09151d;margin-top:16px}.chart svg{width:100%;height:220px}.shopCompare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:16px}.cmp{border:1px solid var(--l);border-radius:14px;padding:12px;background:#0b1820}.cmp div{font-size:12px;color:var(--m);line-height:1.7;margin-top:6px}.note{font-size:12px;color:var(--m);margin-top:12px;line-height:1.7}.error{color:#ffb9a9}.dashboard-status{min-height:20px}
.settlements{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}.settlement{border:1px solid #756337;border-radius:17px;padding:20px;background:radial-gradient(ellipse at 100% 0,#d4af3714,transparent 65%),linear-gradient(145deg,#1b251f,#0b1820);min-width:0}.settlement.forecast{border-color:var(--l);background:linear-gradient(145deg,#11272c,#0a1720)}.eyebrow{font-size:11px;letter-spacing:.08em;color:var(--gold);font-weight:700}.forecast .eyebrow{color:var(--g)}.settlement h3{font-size:20px;margin:8px 0}.settlement-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.status-tag{display:inline-block;font-size:10px;white-space:nowrap;padding:5px 8px;border:1px solid #78663f;border-radius:20px;color:#ffe6a2;background:#d4af370c}.status-tag.pending{border-color:#355261;color:#b1cad9}.cohort{color:var(--m);font-size:12px;margin-top:3px}.amount-label{font-size:12px;color:var(--m);margin-top:24px}.amount{font-size:clamp(26px,4vw,36px);font-weight:800;letter-spacing:-.04em;margin:5px 0 18px;color:var(--gold);font-variant-numeric:tabular-nums}.forecast .amount{color:var(--g)}.settlement dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:0;border-top:1px solid #ffffff12;padding-top:14px}.settlement dt{font-size:11px;color:var(--m)}.settlement dd{font-size:18px;font-weight:700;margin:5px 0 0}.settlement .note{font-size:11px;margin-bottom:0}
.settlement-table{margin-top:22px;padding:16px;border:1px solid #645633;border-radius:16px;background:#0a1720}.settlement-table.forecast-table{border-color:var(--l)}.table-heading{display:flex;align-items:baseline;gap:8px;justify-content:space-between;flex-wrap:wrap}.table-heading h3{margin:2px 0 5px;font-size:18px}.table-heading span{color:var(--m);font-size:12px}.settlement-table table{border-collapse:collapse;width:100%;table-layout:fixed;margin-top:14px;font-size:13px}.settlement-table th,.settlement-table td{padding:12px 8px;border-bottom:1px solid #ffffff0d;text-align:right;overflow-wrap:anywhere}.settlement-table th{color:var(--m);font-size:11px;font-weight:500}.settlement-table th:first-child,.settlement-table td:first-child{text-align:left;width:27%}.settlement-table th:last-child{width:29%}.settlement-table .money{color:var(--gold);font-weight:700;white-space:nowrap;overflow-wrap:normal;font-variant-numeric:tabular-nums}.settlement-table tfoot td{font-weight:700;border-top:1px solid #8e743a;border-bottom:0}.cell-note{white-space:normal;display:block;color:var(--m);font-size:10px;line-height:1.5;margin-top:3px}.settlement-table .waiting{color:var(--m);font-size:11px;font-weight:400}
@media(max-width:760px){.cards{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr 1fr}.shopCompare{grid-template-columns:1fr}.wrap{padding:12px}.dash{padding:14px}.settlements{grid-template-columns:1fr}.settlement{padding:17px}.settlement-table{padding:12px}.settlement-table th,.settlement-table td{padding:11px 3px;font-size:11px}.settlement-table th{font-size:10px}.settlement-table th:first-child{width:26%}.settlement-table th:last-child{width:31%}.settlement-table .money{font-size:12px}}
@media(max-width:460px){.cards{grid-template-columns:1fr}.hero{padding:18px 4px}.hero p{font-size:12px}.dash-head h2{font-size:19px}.dash-head .btn{padding:8px 10px}}
@media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style></head>
<body><div class="wrap">
<div class="hero"><h1>🤝 제휴샵 파트너센터</h1><p>샵별 유입 성과와 월별 정산 현황을 한눈에 확인하세요.</p></div>
<div class="cards" id="cards"></div>
<div class="login" id="login"><h3 id="loginTitle"></h3><div class="row"><input id="pw" type="password" autocomplete="current-password" aria-label="파트너센터 비밀번호" placeholder="비밀번호"><button class="btn" id="go">로그인</button></div><div class="note" id="msg" role="status"></div></div>
<div class="dash" id="dash"></div><p class="note dashboard-status" id="dashboardStatus" role="status"></p>
<p class="note">※ 클릭은 브라우저·샵·일자 기준으로 중복을 줄여 집계합니다. 유입과 회원 유지 여부는 카톡 대화 및 최신 랭킹 집계 기준이며 실제 구매를 의미하지 않습니다.</p>
</div>
<script>
'use strict';
const APP=(window.NW_CONFIG&&window.NW_CONFIG.appScriptUrl)||'', $=id=>document.getElementById(id);
let selected='',admin=false,activeToken='',authSeq=0,loading=false;
function esc(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function jp(action,p,cb){
  if(!APP||APP.includes('PASTE_WEB_APP_URL_HERE')){cb({ok:false,error:'사이트 연동 설정이 필요합니다.'});return;}
  const n='p_'+Date.now()+Math.random().toString(36).slice(2),s=document.createElement('script');let done=false;
  const finish=data=>{if(done)return;done=true;clearTimeout(timer);delete window[n];s.remove();cb(data);};
  const timer=setTimeout(()=>finish({ok:false,error:'연결이 지연되고 있습니다. 잠시 후 새로고침을 눌러주세요.'}),20000);
  window[n]=finish;s.onerror=()=>finish({ok:false,error:'데이터를 불러오지 못했습니다. 연결을 확인해주세요.'});
  s.src=APP+(APP.includes('?')?'&':'?')+new URLSearchParams({action,callback:n,_:Date.now(),...(p||{})});document.body.appendChild(s);
}
async function hash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function cards(){jp('partnerList',{},d=>{
  if(!d.ok){$('msg').textContent=d.error||'파트너 목록을 불러오지 못했습니다.';$('login').classList.add('open');return;}
  $('cards').innerHTML=(d.shops||[]).map(x=>`<button class="card" data-shop="${esc(x.name)}"><b>${esc(x.name)}</b><span>${esc(x.region)}</span><span>🔐 파트너 로그인</span></button>`).join('')+'<button class="card admin" data-admin="1"><b>관리자</b><span>전체 제휴샵 성과 · 월별 정산표</span><span>🔐 관리자 로그인</span></button>';
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{authSeq++;activeToken='';loading=false;admin=!!c.dataset.admin;selected=c.dataset.shop||'관리자';$('loginTitle').textContent=selected+' 로그인';$('login').classList.add('open');$('dash').classList.remove('open');$('dashboardStatus').textContent='';$('msg').textContent='';$('pw').value='';$('go').disabled=false;$('pw').focus();});
});}
function k(v){return Number(v||0).toLocaleString('ko-KR');}
function money(v){return v==null?'—':k(v)+'원';}
function monthLabel(v){const m=String(v||'').match(/^(\d{4})-(\d{2})$/);return m?m[1]+'년 '+Number(m[2])+'월':'월 확인 중';}
const statusLabel={collecting:'집계 중 · 예정',awaiting_confirmation:'1일 정산 확정 대기',confirmed:'확정 · 금액 고정'};
function placeholder(){return '<section class="settlement"><div class="eyebrow">MONTHLY SETTLEMENT</div><h3>월별 정산</h3><div class="amount">—</div><p class="note">정산 집계를 준비하고 있습니다. 최신 데이터를 불러온 뒤 표시됩니다.</p></section>';}
function settlementCard(s,forecast){
  if(!s)return placeholder();
  return `<section class="settlement${forecast?' forecast':''}"><div class="settlement-top"><span class="eyebrow">${forecast?'NEXT MONTH':'MONTHLY SETTLEMENT'}</span><span class="status-tag${s.status==='confirmed'?'':' pending'}">${esc(statusLabel[s.status]||'집계 대기')}</span></div><h3>${esc(monthLabel(s.payoutMonth))} ${forecast?'정산 예정':'정산'}</h3><div class="cohort">${esc(monthLabel(s.sourceMonth))} 유입 회원 기준</div><div class="amount-label">${forecast?'현재 기준 예상 정산금':s.status==='confirmed'?'확정 정산금':'정산 확정 대기'}</div><div class="amount">${money(s.amount)}</div><dl><div><dt>유입 회원</dt><dd>${k(s.referrals)}명</dd></div><div><dt>계속 유지</dt><dd>${k(s.qualified)}명</dd></div><div><dt>확인 필요</dt><dd>${k(s.review)}명</dd></div></dl><p class="note">유지 ${k(s.qualified)}명 × ${k(s.unitPay)}원 · 제외 ${k(s.excluded)}명<br>집계 기준: ${esc(s.asOf||'확인 대기')}${s.status==='awaiting_confirmation'?'<br>매월 1일 전월 대화 집계 때 확정됩니다.':s.confirmedAt?'<br>확정 시각: '+esc(s.confirmedAt)+' · 이후 변동 없음':''}</p></section>`;
}
function settlementNote(){return '<p class="note">매월 1일 전월 대화 집계 때 계속 유지 중인 회원 1인당 500원으로 확정합니다. 확정된 인원·금액은 이후 퇴장·재집계와 관계없이 고정됩니다. 미확정 예정금만 최신 집계에 따라 달라집니다. 중복·퇴장·강퇴·식별 불가 건은 확정 대상에서 제외하며, 확정은 지급 완료를 의미하지 않습니다.</p>';}
function chart(months){const data=months||[],W=720,H=210,p=28,max=Math.max(1,...data.flatMap(x=>[Number(x.clicks)||0,Number(x.referrals)||0])),bw=(W-p*2)/Math.max(1,data.length);const bars=data.map((x,i)=>{const h1=(Number(x.clicks)||0)/max*(H-70),h2=(Number(x.referrals)||0)/max*(H-70),x0=p+i*bw;return `<rect x="${x0+5}" y="${H-35-h1}" width="${Math.max(7,bw*.32)}" height="${h1}" rx="3" fill="#55c8ff"/><rect x="${x0+8+bw*.34}" y="${H-35-h2}" width="${Math.max(7,bw*.32)}" height="${h2}" rx="3" fill="#6ce0a6"/><text x="${x0+bw/2}" y="${H-12}" fill="#9bb2c2" font-size="10" text-anchor="middle">${esc(String(x.month).slice(5))}월</text>`;}).join('');return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 6개월 클릭과 유입 추이"><text x="28" y="18" fill="#9fc0d0" font-size="11">파랑 클릭 · 초록 유입</text>${bars}</svg>`;}
function dashboardHeader(title){return `<div class="dash-head"><h2>${esc(title)}</h2><button class="btn" id="refreshData" type="button">새로고침</button></div>`;}
function renderShop(d){const x=d.data;$('dash').classList.add('open');$('dash').innerHTML=dashboardHeader(x.shop+' 성과')+`<div class="settlements">${settlementCard(x.settlement?.current,false)}${settlementCard(x.settlement?.next,true)}</div>`+settlementNote()+`<div class="kpis">${[['이번 달 유입',k(x.monthReferrals)+'명'],['누적 유입',k(x.totalReferrals)+'명'],['현재 잔존',k(x.present)+'명'],['잔존율',k(x.retention)+'%'],['이번 달 클릭',k(x.monthClicks)],['누적 클릭',k(x.totalClicks)],['이탈',k(x.departed)+'명'],['확인 필요',k(x.review)+'명']].map(([label,value])=>`<div class="kpi"><small>${label}</small><strong>${value}</strong></div>`).join('')}</div><div class="chart"><h3>최근 6개월 추이</h3>${chart(x.months)}</div>`;}
function settlementTable(shops,forecast){
  const key=forecast?'next':'current',sample=shops.find(x=>x.settlement?.[key])?.settlement[key];if(!sample)return placeholder();
  const allReady=shops.every(x=>x.settlement?.[key]?.amount!=null),sum=field=>shops.reduce((n,x)=>n+(Number(x.settlement?.[key]?.[field])||0),0);
  const rows=shops.map(x=>{const s=x.settlement?.[key];return `<tr><td>${esc(x.shop)}</td><td>${s?k(s.referrals)+' → '+k(s.qualified):'—'}<span class="cell-note">유입 → 유지</span></td><td>${s?k(s.review)+'명':'—'}<span class="cell-note">제외 ${k(s?.excluded)}명</span></td><td class="money">${money(s?.amount)}<span class="cell-note waiting">${esc(statusLabel[s?.status]||'집계 대기')}</span></td></tr>`;}).join('');
  return `<section class="settlement-table${forecast?' forecast-table':''}"><div class="table-heading"><h3>${esc(monthLabel(sample.payoutMonth))} ${forecast?'정산 예정표':'전체 정산표'}</h3><span>${esc(monthLabel(sample.sourceMonth))} 유입분 · 1인당 500원</span></div><table><thead><tr><th scope="col">제휴샵</th><th scope="col">유입·유지</th><th scope="col">확인 필요</th><th scope="col">${forecast?'예상 정산금':'확정 정산금'}</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td>전체 합계</td><td>${k(sum('referrals'))} → ${k(sum('qualified'))}</td><td>${k(sum('review'))}명</td><td class="money">${money(allReady?sum('amount'):null)}</td></tr></tfoot></table><p class="note">집계 기준: ${esc(sample.asOf||'확인 대기')}${!allReady?' · 매월 1일 전월 집계 때 정산을 확정합니다.':!forecast&&sample.confirmedAt?' · 확정 '+esc(sample.confirmedAt)+' · 이후 변동 없음':''}</p></section>`;
}
function renderAdmin(d){const shops=d.shops||[];$('dash').classList.add('open');$('dash').innerHTML=dashboardHeader('관리자 · 전체 제휴샵')+settlementTable(shops,false)+settlementTable(shops,true)+settlementNote()+`<div class="shopCompare">${shops.map(x=>`<div class="cmp"><b>${esc(x.shop)}</b><div>유입 ${k(x.totalReferrals)} · 잔존 ${k(x.present)} · 잔존율 ${k(x.retention)}% · 클릭 ${k(x.totalClicks)}</div></div>`).join('')}</div>`;}
function refreshData(){
  if(!activeToken||loading)return;loading=true;const seq=authSeq;
  $('dashboardStatus').textContent='최신 집계 확인 중…';$('dashboardStatus').classList.remove('error');
  jp(admin?'adminPartnerData':'partnerData',{token:activeToken},data=>{if(seq!==authSeq)return;loading=false;if(!data.ok){$('dashboardStatus').textContent=data.error||'데이터 불러오기 실패';$('dashboardStatus').classList.add('error');return;}admin?renderAdmin(data):renderShop(data);$('refreshData').onclick=refreshData;$('dashboardStatus').textContent='최신 집계가 반영되었습니다. 화면을 보는 동안 1분마다 갱신합니다.';});
}
async function login(){
  const pw=$('pw').value;if(!pw)return;const seq=authSeq;$('go').disabled=true;$('msg').textContent='확인 중…';
  try{const h=await hash(pw);if(seq!==authSeq)return;jp(admin?'adminLogin':'partnerLogin',admin?{hash:h}:{shop:selected,hash:h},d=>{if(seq!==authSeq)return;$('go').disabled=false;if(!d.ok){$('msg').textContent=d.error||'로그인 실패';return;}$('pw').value='';$('msg').textContent='로그인 완료';activeToken=d.token;sessionStorage.setItem(admin?'nwAdminToken':'nwPartnerToken',d.token);refreshData();});}
  catch{if(seq===authSeq){$('go').disabled=false;$('msg').textContent='로그인을 진행하지 못했습니다. 잠시 후 다시 시도해주세요.';}}
}
$('go').onclick=login;$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
setInterval(()=>{if(document.visibilityState==='visible'&&$('dash').classList.contains('open'))refreshData();},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&$('dash').classList.contains('open'))refreshData();});
cards();
</script></body></html>
