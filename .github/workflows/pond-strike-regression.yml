name: Survival Pond stage-5 regression
on:
  push:
    branches:
      - pond/stage3-attack-categories
      - pond/stage6-native-attack-motion-audio
      - pond/stage7-wide-screen-full-appearance
      - pond/unified-creature-scale-bilateral-pairs
      - pond/volume-alpha-revival-cost
    paths:
      - 'draw/pond.html'
      - 'draw/pondApp.e4104cc4.js'
      - 'draw/*-strike.*'
      - 'tests/pond-*.test.mjs'
      - '.github/workflows/pond-strike-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pond-strikes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate attacks, revival, media bundles and positions
        run: |
          node --input-type=module --check < draw/pondApp.e4104cc4.js
          node --test tests/pond-random-attacks.test.mjs tests/pond-revival.test.mjs tests/pond-strike-assets.test.mjs
