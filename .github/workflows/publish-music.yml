name: Publish uploaded music as direct MP3
on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/publish-music.mjs
      - .github/workflows/publish-music.yml
permissions:
  contents: write
  pages: write
concurrency:
  group: publish-uploaded-music
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /site-config.js
            /tools/publish-music.mjs
            /assets/music/published/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/publish-music.mjs
      - name: Commit published audio and request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add assets/music/published
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Publish uploaded music for direct playback'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          if ! curl -fsSL "https://ehrlckdqud-cloud.github.io/newtworld-ranking/assets/music/published/manifest.json" -o /tmp/music-live.json || ! cmp -s /tmp/music-live.json assets/music/published/manifest.json; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
          fi
