name: Native player preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-player-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: python3 mobile/tools/bundle-web.py
      - run: node --test mobile/tests/*.test.cjs
      - run: cc mobile/tests/dsp_test.c mobile/ios/NewtWorld/EqualizerDSP.c -lm -o /tmp/newt-dsp-test && /tmp/newt-dsp-test
      - run: gradle -p mobile/android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: newtworld-android-preview
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 3
  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 mobile/tools/bundle-web.py
      - name: Start iPhone simulator while building
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if d["name"].startswith("iPhone")))')
          echo "NEWT_SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
      - run: brew install xcodegen
      - run: xcodegen generate --spec mobile/ios/project.yml
      - run: xcodebuild -project mobile/ios/NewtWorld.xcodeproj -scheme NewtWorld -sdk iphonesimulator -configuration Debug -derivedDataPath mobile/ios/build CODE_SIGNING_ALLOWED=NO build

      - name: Test iOS persistent music library
        timeout-minutes: 12
        run: |
          DEVICE_ID="$NEWT_SIMULATOR_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild -project mobile/ios/NewtWorld.xcodeproj -scheme NewtWorld -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath mobile/ios/build CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 60 test
  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: python3 mobile/tools/bundle-web.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            gradle -p mobile/android connectedDebugAndroidTest || { cat mobile/android/app/build/outputs/androidTest-results/connected/debug/*/*.xml; exit 1; }
