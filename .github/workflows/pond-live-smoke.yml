name: Survival Pond live deployment smoke check
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pond-live-smoke.yml
      - draw/pond.html
      - draw/pondApp.e4104cc4.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-static-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify published Pond HTML, JS, and attack assets
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const base='https://ehrlckdqud-cloud.github.io/newtworld-ranking/draw/';
          const suffix='?stage15=platypus-no-circle';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function read(path) {
            let last;
            for (let attempt=1;attempt<=12;attempt++) {
              try {
                const response=await fetch(base+path+suffix, {signal:AbortSignal.timeout(20000),cache:'no-store'});
                if(!response.ok)throw new Error(path+' HTTP '+response.status);
                return new Uint8Array(await response.arrayBuffer());
              }catch(e){last=e;if(attempt<12)await sleep(5000)}
            }
            throw last;
          }
          const decode=bytes=>new TextDecoder().decode(bytes);
          let html='';
          for(let i=0;i<60;i++){
            html=decode(await read('pond.html'));
            if(html.includes('pond-strikes-15-platypus-no-circle')&&html.includes('content-access.js?v=pond-revival-cost-300'))break;
            if(i<59)await sleep(5000);
          }
          assert.match(html,/pondApp\.e4104cc4\.js\?v=pond-strikes-15-platypus-no-circle/);
          assert.ok(html.includes('content-access.js?v=pond-revival-cost-300'),'corrected first-paint cost script cache version');
          assert.match(html,/동물 12종/);
          assert.match(html,/12종 동물 영상/);
          const js=decode(await read('pondApp.e4104cc4.js'));
          const begin=js.indexOf('const pondStrikes = '),end=js.indexOf(';\nfunction strikePoint(',begin);
          assert.ok(begin>=0 && end>begin,'attack source metadata');
          const strikes=JSON.parse(js.slice(begin+'const pondStrikes = '.length,end));
          for(const name of ['tomatofrog','snappingturtle2','otter','platypus']){
            assert.ok(js.includes('"'+name+'"'),name);
            assert.equal(strikes[name].frames,120,name+' full 5s 24fps strike');
          }
          assert.ok(js.includes('key==="snappingturtle"?"파충류":"양서류"'));
          assert.ok(js.includes('const speciesScale=e==="otter"?1.34'), 'otter relative body size corrected');
          assert.ok(js.includes('const paired=r?.lane!=null,fromLeft=paired?r.lane===0:'), 'two simultaneous creatures enter from different banks');
          assert.ok(js.includes('reference*speciesScale'), 'common treefrog silhouette reference scale');
          assert.ok(!js.includes('const left=paired?(r.lane*.5'), 'paired creatures are not squeezed to half-screen');
          assert.ok(js.includes('pond15-platypus-no-circle'), 'platypus repaired sprite cache is active');
          assert.ok(js.includes('v=pond13-volume-matte'), 'original 2x new-species sound cache remains active');
          assert.ok(js.includes('nw-pond-duration-restored'), 'restored revival mode refresh event active');
          const access=decode(await read('../assets/content-access.js'));
          assert.ok(access.includes('nw-pond-duration-restored'), 'cost label follows restored duration');
          assert.ok(access.includes("?'300':game==='pond'?'200'"), 'revival first-paint cost defaults to 300');
          for(const kind of ['tomatofrog','snappingturtle2','otter','platypus']){
            for(const ext of ['webp','wav','bin']){
              const path=kind+'-strike.'+ext,bytes=await read(path);
              assert.ok(bytes.byteLength>48,path);
              assert.equal(decode(bytes.slice(0,4)),'RIFF',path);
              assert.equal(decode(bytes.slice(8,12)),ext==='wav'?'WAVE':'WEBP',path);
              console.log('PASS',path,bytes.byteLength,'bytes');
            }
          }
          const manifest=JSON.parse(decode(await read('platypus-matte-check.json')));
          assert.equal(manifest.version,'pond15-platypus-no-circle');
          assert.equal(strikes.platypus.matteVersion,manifest.version);
          for(const [path,expected] of Object.entries(manifest.files)){
            const bytes=await read(path);
            assert.equal(createHash('sha256').update(bytes).digest('hex'),expected,path+' deployed exact tested asset');
          }
          assert.equal(createHash('sha256').update(await read('platypus-strike.wav')).digest('hex'),manifest.unchangedAudioSha256,'platypus 2x audio unchanged');
          console.log('PASS exact tested platypus no-circle assets, preserved eye and unchanged audio');
          NODE
