name: Survival Pond platypus white-circle repair
on:
  push:
    branches: [pond/platypus-no-white-circle]
    paths:
      - tools/pond_eye_matte.py
      - tools/rebuild-pond-full-attacks.py
      - tools/rebuild-pond-platypus-only.py
      - tests/pond-platypus-circle.test.py
      - .github/workflows/pond-platypus-circle.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pond-platypus-circle-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rebuild-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install media inspection dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless imageio-ffmpeg
      - name: Rebuild platypus only, keeping all published audio unchanged
        run: python tools/rebuild-pond-platypus-only.py
      - name: Validate actual frames, original eye whites, mouth gap and unchanged assets
        run: |
          python tests/pond-platypus-circle.test.py
          node --input-type=module --check < draw/pondApp.e4104cc4.js
          node --test tests/pond-random-attacks.test.mjs tests/pond-revival.test.mjs tests/pond-strike-assets.test.mjs
          git diff --check
      - name: Save all-frame visual inspection and pixel report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platypus-circle-frame-audit
          path: |
            checks/*.jpg
            checks/*.png
            checks/pixel-report.json
            checks/protected-assets.json
          retention-days: 14
      - name: Commit only verified platypus assets and deployment cache version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add draw/platypus-strike.bin draw/platypus-strike.webp draw/platypus-matte-check.json
          git add draw/pond-full-meta.json draw/pondApp.e4104cc4.js draw/pond.html
          git add .github/workflows/pond-live-smoke.yml
          if ! git diff --cached --quiet; then
            git commit -m "assets(pond): remove platypus mouth circle while retaining original eye whites"
            git push origin HEAD:pond/platypus-no-white-circle
          fi
