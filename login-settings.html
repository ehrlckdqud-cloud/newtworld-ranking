<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071018">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>간편 로그인 설정 · 뉴트월드 관리자</title>
<style>
:root{color-scheme:dark;--line:#294758;--text:#eef8ff;--muted:#a2bcca}*{box-sizing:border-box}body{margin:0;padding:28px 22px 42px;background:radial-gradient(ellipse at 50% 0,#173d324d,transparent 55%),#071018;color:var(--text);font:16px/1.65 Arial,"Noto Sans KR",sans-serif}button,input{font:inherit}[hidden]{display:none!important}a{color:#a8e6cb}.shell{max-width:1040px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:25px}.brand{font-size:12px;letter-spacing:.12em;color:#8ddbb7;font-weight:800}h1{font-size:27px;letter-spacing:-1px;margin:5px 0}h2{margin:0 0 8px;font-size:18px}p{margin:6px 0 16px;color:var(--muted)}.status{padding:13px 16px;background:#102b27;border:1px solid #36594d;border-radius:12px;overflow-wrap:anywhere}.status:empty{display:none}.button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 15px;border-radius:11px;border:1px solid #395c68;background:#10242d;color:var(--text);font-weight:750;cursor:pointer;text-decoration:none}.button.primary{background:#125143;border-color:#3e9c7b}.button:disabled{opacity:.55;cursor:default}.button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #86e4be;outline-offset:3px}.panel{padding:23px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#10232a,#0c1720);margin-top:18px}.provider-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.provider-card{padding:21px;border:1px solid var(--line);border-radius:17px;background:#0d1e26}.provider-card h2{display:flex;align-items:center;justify-content:space-between;gap:10px}.badge{font-size:12px;padding:3px 8px;border:1px solid #46635d;border-radius:999px;color:#bbd9ce;font-weight:500}.field{display:grid;gap:7px;margin:17px 0}.field>span{font-size:14px;font-weight:800;color:#bfd6df}.field input{width:100%;min-width:0;border:1px solid #345365;border-radius:10px;padding:11px 12px;color:#fff;background:#08151e;font-size:14px}.field small,.hint{color:var(--muted);font-size:14px;line-height:1.65}.toggle{display:flex;gap:10px;align-items:center;font-weight:750}.toggle input{width:19px;height:19px;accent-color:#67d9a8}.callback{display:flex;gap:10px;align-items:center}.callback code{flex:1;min-width:0;padding:11px 13px;background:#07131b;border:1px solid #345365;border-radius:10px;font-size:14px;overflow-wrap:anywhere;color:#d7ece4}.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px}.actions p{margin:0;flex:1;min-width:180px}.provider-note{min-height:40px}.section-intro{margin:24px 0 14px}@media(max-width:800px){.provider-grid{grid-template-columns:1fr}.provider-note{min-height:0}.provider-card{padding:22px}.top{align-items:flex-start}h1{font-size:24px}}@media(max-width:450px){body{padding:22px 16px 32px}.top{flex-direction:column;gap:10px}.panel{padding:18px}.callback{align-items:stretch;flex-direction:column}.actions .button{width:100%}}
</style>
<script src="site-config.js" defer></script>
<script src="assets/newt-ui.js" defer></script>
<script src="assets/content-access.js?v=social-login-1" defer></script>
<script src="assets/admin-access.js" defer></script>
<script src="assets/social-login-settings.js?v=1" defer></script>
</head>
<body>
<main class="shell">
  <header class="top"><div><div class="brand">NEWT WORLD · ADMIN</div><h1>간편 로그인 설정</h1><p>기존 회원 정보에 연결할 로그인 제공자를 설정합니다.</p></div><a class="button" href="index.html">홈으로</a></header>
  <div id="adminStatus" class="status" role="status" aria-live="polite">관리자 인증을 확인하고 있어요.</div>
  <button id="adminRetry" class="button" type="button" hidden style="margin-top:12px">관리자 로그인 다시 하기</button>
  <div id="adminBody" hidden>
    <section class="panel" aria-labelledby="callbackTitle"><h2 id="callbackTitle">로그인 후 돌아올 주소</h2><p>각 제공자의 개발자 설정에서 아래 주소를 Redirect URI 또는 Callback URL로 등록해주세요.</p><div class="callback"><code id="redirectUri"></code><button id="copyRedirect" class="button" type="button">주소 복사</button></div><p id="copyStatus" class="hint" role="status" style="margin-top:10px"></p></section>
    <p class="section-intro">개발자 앱의 키를 입력한 뒤 사용할 로그인을 켜주세요. 비밀키는 저장 후 다시 표시하지 않으며, 비워 두면 기존 값을 유지합니다.</p>
    <form id="loginSettings" autocomplete="off">
      <div id="providerSettings" class="provider-grid"></div>
      <div class="actions"><button id="saveSettings" class="button primary" type="submit">로그인 설정 저장</button><a class="button" href="login.html">로그인 화면 확인</a><p class="hint">네이버는 일반 회원에게 공개하기 전에 네이버 개발자센터의 사전 검수 승인이 필요합니다.</p></div>
    </form>
    <div id="saveStatus" class="status" role="status" aria-live="polite" style="margin-top:18px"></div>
  </div>
  <noscript><p class="status">설정을 이용하려면 JavaScript를 허용해주세요.</p></noscript>
</main>
</body>
</html>
