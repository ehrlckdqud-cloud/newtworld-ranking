<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>뉴트월드 오운완</title><meta name="theme-color" content="#071018"><script src="site-config.js"></script>
<style>
:root{--bg:#071018;--panel:#0d1b24;--panel2:#122833;--text:#eff8ff;--muted:#8da8ba;--line:#244455;--green:#6ce0a6;--gold:#ffd569;--cyan:#55c8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -5%,rgba(38,104,72,.32),transparent 32%),linear-gradient(#071018,#08151d);color:var(--text);font-family:Inter,system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:1120px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 18px}.back{color:#b9d7e7;text-decoration:none;border:1px solid var(--line);padding:9px 12px;border-radius:12px;background:#0c1820}.hero{text-align:center;padding:28px 14px 18px}.hero h1{font-size:clamp(30px,6vw,52px);margin:0}.hero p{color:var(--muted);line-height:1.7}.rule{margin:12px auto;max-width:760px;border:1px solid #36543b;background:#101f16;border-radius:16px;padding:14px;color:#cfe9d4;font-size:13px;line-height:1.7}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:14px}.stat small{display:block;color:var(--muted)}.stat strong{font-size:24px;display:block;margin-top:4px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.controls input,.controls select{background:#0b1821;color:white;border:1px solid var(--line);border-radius:12px;padding:10px 12px}.controls input{flex:1;min-width:220px}.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.pod{border:1px solid #35523c;background:linear-gradient(180deg,#13251a,#0c1811);border-radius:18px;padding:15px}.pod b{font-size:18px}.pod span{display:block;color:#a8c9af;margin-top:5px}.table{overflow:auto;border:1px solid var(--line);border-radius:18px;background:#09141c}table{width:100%;border-collapse:collapse;min-width:780px}th,td{padding:12px 10px;border-bottom:1px solid #19313e;text-align:center}th{position:sticky;top:0;background:#112632;color:#a9cee1;font-size:12px}td.name{text-align:left;font-weight:800}.streak{color:#ffb85c}.empty{padding:40px;text-align:center;color:var(--muted)}.notice{color:#8fb0c1;font-size:11px;margin-top:10px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.podium{grid-template-columns:1fr}.hero{padding-top:10px}}
.embedded .top{display:none}.embedded .wrap{padding-top:8px}
</style></head><body><script>
(function(){
  const embedded=new URLSearchParams(location.search).get('embedded')==='1';
  if(embedded) document.documentElement.classList.add('embedded');
})();
</script><div class="wrap"><div class="top"><a class="back" href="index.html" id="nwWorkoutBack">← 활동왕 랭킹</a><span style="color:#7194a7;font-size:11px">NEWT WORLD HABIT</span></div><div class="hero"><h1>🏃 오운완 챌린지 🏋️</h1><p>매일의 작은 성공을 기록합니다. 함께 운동 습관을 만들어봐요.</p><div class="rule">운동이 끝난 뒤 채팅에 <b>오운완</b>만 입력해주세요.<br>다른 문구가 섞이면 기록되지 않으며, 같은 날 여러 번 입력해도 <b>1일 1회</b>만 인정됩니다.</div></div><div class="stats"><div class="stat"><small>최근 집계일 오운완</small><strong id="today">-</strong><span id="latestDate" style="display:block;color:#6f91a3;font-size:10px;margin-top:4px"></span></div><div class="stat"><small>이번 달 전체 기록</small><strong id="monthTotal">-</strong></div><div class="stat"><small>현재 최장 연속</small><strong id="currentBest">-</strong></div><div class="stat"><small>역대 최고 연속</small><strong id="maxBest">-</strong></div></div><div class="podium" id="podium"></div><div class="controls"><input id="q" placeholder="닉네임 / 회원ID 검색"><select id="month"></select></div><div class="table"><table><thead><tr><th>순위</th><th style="text-align:left">이름</th><th>선택월</th><th>TOTAL</th><th>MON AVG.</th><th>현재연속</th><th>최고연속</th></tr></thead><tbody id="tb"></tbody></table><div class="empty" id="empty" style="display:none">오운완 데이터가 아직 없습니다.</div></div><div class="notice">※ 카카오톡 대화내보내기 자동집계 결과를 기준으로 표시됩니다.</div></div><script>
const $=id=>document.getElementById(id);let DATA=null;function fmt(n){return Number(n||0).toLocaleString('ko-KR')}function jsonp(action,cb){const url=(window.NW_CONFIG&&window.NW_CONFIG.appScriptUrl)||'';if(!url||url.includes('PASTE_WEB_APP_URL_HERE')){$('empty').style.display='block';$('empty').textContent='사이트 연동 설정이 필요합니다.';return;}const name='nwWorkout_'+Date.now();window[name]=d=>{try{cb(d)}finally{delete window[name];document.getElementById(name)?.remove()}};const s=document.createElement('script');s.id=name;s.src=url+(url.includes('?')?'&':'?')+'action='+action+'&callback='+name+'&_='+Date.now();document.body.appendChild(s)}function render(){if(!DATA||!DATA.ok)return;const mon=$('month').value||DATA.months[0]||'';const query=$('q').value.trim().toLowerCase();let arr=DATA.members.filter(x=>!query||x.nick.toLowerCase().includes(query)||String(x.id).toLowerCase().includes(query));arr.sort((a,b)=>(b.months?.[mon]||0)-(a.months?.[mon]||0)||b.total-a.total);$('tb').innerHTML='';arr.forEach((x,i)=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${i+1}</td><td class="name">${x.nick}<small style="display:block;color:#69899b">${x.id||''}</small></td><td><b>${fmt(x.months?.[mon]||0)}</b></td><td>${fmt(x.total)}</td><td>${Number(x.avg||0).toFixed(1)}</td><td class="streak">🔥 ${fmt(x.currentStreak)}</td><td>${fmt(x.maxStreak)}</td>`;$('tb').appendChild(tr)});$('empty').style.display=arr.length?'none':'block';const monthTotal=DATA.members.reduce((s,x)=>s+Number(x.months?.[mon]||0),0);$('monthTotal').textContent=fmt(monthTotal)+'회';$('currentBest').textContent=fmt(Math.max(0,...DATA.members.map(x=>Number(x.currentStreak||0))))+'일';$('maxBest').textContent=fmt(Math.max(0,...DATA.members.map(x=>Number(x.maxStreak||0))))+'일';const top=[...DATA.members].sort((a,b)=>(b.months?.[mon]||0)-(a.months?.[mon]||0)||b.total-a.total).slice(0,3);$('podium').innerHTML=top.map((x,i)=>`<div class="pod"><small>${['🥇 1위','🥈 2위','🥉 3위'][i]}</small><b>${x.nick}</b><span>${mon.slice(5)}월 ${fmt(x.months?.[mon]||0)}회 · TOTAL ${fmt(x.total)}</span></div>`).join('')}
jsonp('workout',d=>{DATA=d;if(!d||!d.ok){$('empty').style.display='block';$('empty').textContent='데이터를 불러오지 못했습니다.';return;}$('today').textContent=fmt(d.latestCount)+'명';$('latestDate').textContent=d.latestDate?('기준 '+d.latestDate.replaceAll('-','.')):'';$('month').innerHTML=(d.months||[]).map(m=>`<option value="${m}">${m.replace('-','.')}월</option>`).join('');render()});$('q').addEventListener('input',render);$('month').addEventListener('change',render);
</script>
<script>
(function(){
  const back=document.getElementById('nwWorkoutBack');
  if(back){
    back.addEventListener('click',e=>{
      if(window.parent!==window){
        e.preventDefault();
        window.parent.postMessage('nw-close-workout','*');
      }
    });
  }
})();
</script>

</body></html>
