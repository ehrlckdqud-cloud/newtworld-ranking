<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071018">
<title>뉴트월드 회원 찾기</title><script src="site-config.js"></script>
<style>
:root{--bg:#071018;--panel:#0d1a23ee;--line:#294758;--text:#eff8ff;--muted:#8faebd;--green:#66d7a8;--blue:#67b7ff;--gold:#f3c35f;--red:#ff7a82}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(#071018,#08131a 60%,#061018);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif}body{padding:18px}.shell{max-width:1180px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.title{font-size:24px;font-weight:900}.muted{color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);background:#0e1d27;color:#edf8ff;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;transition:.16s}.btn.primary{background:#0f4e43;border-color:#348c77}.btn:hover{border-color:#5fbea3;transform:translateY(-1px)}.card{background:linear-gradient(180deg,rgba(14,28,38,.97),rgba(8,17,24,.97));border:1px solid var(--line);border-radius:17px;box-shadow:0 16px 40px rgba(0,0,0,.22)}.gate{max-width:650px;margin:80px auto;padding:26px;text-align:center}.gate h2{font-size:26px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.tabs button.active{background:#154f48;border-color:#57bea2}.panel{padding:16px}.filters{display:grid;grid-template-columns:1.2fr .7fr 1fr .7fr auto;gap:8px}.filters input,.filters select{padding:11px 12px;border:1px solid #294758;border-radius:10px;background:#08141c;color:#fff}.result-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.member{padding:14px;cursor:pointer;transition:.16s}.member:hover{transform:translateY(-2px);border-color:#4f9d89}.member h3{margin:0 0 6px;font-size:16px}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.chip{font-size:10px;padding:4px 7px;border:1px solid #315466;border-radius:999px;color:#b9dce9;background:#0d2631}.chip.profiled{border-color:#2d8068;color:#90eccb;background:#0d2c26}.empty{padding:24px;text-align:center;color:#83a2b0}.error{padding:14px;border:1px solid #653a42;background:#30171d;color:#ffabb0;border-radius:12px;margin-top:12px}.detail{padding:19px}.detail-head{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}.avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#f0c066,#b96127);font-size:36px;overflow:hidden}.detail-name{font-size:28px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:14px 0}.stat{padding:12px}.stat small{color:#88aaba}.stat strong{display:block;font-size:22px;margin-top:4px}.profile-box{display:grid;grid-template-columns:1fr 1fr;gap:10px}.section{padding:15px}.section h3{margin:0 0 10px}.species{display:grid;gap:6px}.sp{display:flex;justify-content:space-between;gap:16px;padding:8px 10px;border:1px solid #223d4b;border-radius:9px;background:#081821}.sp span{text-align:right}.kmap-wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.kmap{padding:14px;min-height:650px;background:radial-gradient(ellipse at 50% 42%,rgba(63,117,105,.18),transparent 58%),linear-gradient(180deg,#0a1720,#08131a)}.kmap svg{width:100%;height:620px;display:block}.kr-region{cursor:pointer;transition:.16s}.kr-region path,.kr-region polygon{fill:#173e39;stroke:#66a18e;stroke-width:1.6}.kr-region:hover path,.kr-region:hover polygon,.kr-region.active path,.kr-region.active polygon{fill:#246f5f;stroke:#9ce8cb;stroke-width:2.5}.kr-region text{pointer-events:none;fill:#e8fff7;font-size:11px;font-weight:900;text-anchor:middle}.kr-region .count{fill:#9dd8c4;font-size:9px;font-weight:700}.map-results{padding:15px;max-height:650px;overflow:auto}.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.bigstat{padding:16px}.bigstat strong{display:block;font-size:26px;margin-top:5px}.bars{display:grid;gap:8px;margin-top:10px}.barrow{display:grid;grid-template-columns:130px 1fr 70px;gap:8px;align-items:center;font-size:12px}.bar{height:9px;background:#20303a;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#59bfff,#58d09f);border-radius:99px}.note{padding:11px 13px;border-radius:11px;background:#292411;border:1px solid #5f5427;color:#eadb91;font-size:11px;line-height:1.6;margin-top:12px}.hidden{display:none!important}.detail-only .tabs,.detail-only #tabSearch,.detail-only #tabMap,.detail-only #tabStats{display:none!important}.detail-only #detailPanel{margin-top:0!important}.backline{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
@media(max-width:900px){body{padding:10px}.result-grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.filters input:first-child{grid-column:1/-1}.kmap-wrap{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.stats .stat:last-child{grid-column:1/-1}.profile-box{grid-template-columns:1fr}.stat-cards{grid-template-columns:repeat(2,1fr)}.kmap svg{height:560px}.kmap{min-height:590px}}@media(max-width:560px){.result-grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.filters input:first-child{grid-column:auto}.barrow{grid-template-columns:90px 1fr 55px}.title{font-size:20px}.kmap svg{height:520px}.kmap{min-height:550px}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><div class="shell">
<div class="top"><div><div class="title">🔎 뉴트월드 회원 찾기</div><div class="muted">회원식별 로그인을 완료한 재실 회원 전용 기능</div></div><button class="btn" id="closeBtn">닫기</button></div>
<section id="gate" class="card gate hidden"><h2>🔒 회원 전용 기능입니다</h2><p class="muted" style="line-height:1.8">회원 상세보기 · 보유종/마릿수 · 지역 검색 · 지역 지도 · 종별 통계는 회원식별 인증 후 이용할 수 있습니다.</p><button class="btn primary" id="authBtn">내 페이지에서 회원 인증하기</button></section>
<main id="app" class="hidden">
<div class="tabs"><button class="btn active" data-tab="search">회원 검색</button><button class="btn" data-tab="map">대한민국 지역 지도</button><button class="btn" data-tab="stats">통계</button></div>
<section id="tabSearch" class="card panel"><div class="filters"><input id="q" placeholder="닉네임 · 지역 · 관심종 검색"><select id="region"><option value="">전체 지역</option><option>서울</option><option>부산</option><option>대구</option><option>인천</option><option>광주</option><option>대전</option><option>울산</option><option>세종</option><option>경기</option><option>강원</option><option>충북</option><option>충남</option><option>전북</option><option>전남</option><option>경북</option><option>경남</option><option>제주</option></select><input id="species" placeholder="보유종 부분검색"><select id="breeding"><option value="">번식경험 전체</option><option>없음</option><option>있음</option><option>현재 번식 중</option></select><button class="btn primary" id="searchBtn">검색</button></div><div class="muted" id="count" style="margin-top:10px"></div><div id="searchError"></div><div id="results" class="result-grid"></div></section>
<section id="tabMap" class="hidden"><div class="kmap-wrap"><div class="card kmap"><svg id="kmap" viewBox="0 0 360 640" role="img" aria-label="대한민국 지역 선택 지도">
<!-- 단순화한 대한민국 행정구역 인터랙티브 지도 -->
<g class="kr-region" data-region="강원"><polygon points="205,62 285,90 300,155 272,205 220,180 200,118"/><text x="252" y="132">강원</text><text class="count" x="252" y="148"></text></g>
<g class="kr-region" data-region="경기"><polygon points="128,82 202,62 215,120 195,188 130,182 108,130"/><text x="165" y="138">경기</text><text class="count" x="165" y="154"></text></g>
<g class="kr-region" data-region="서울"><polygon points="145,126 165,120 176,132 166,146 145,143"/><text x="160" y="137">서울</text></g>

<g class="kr-region" data-region="충북"><polygon points="160,190 220,183 245,235 213,276 162,250 145,215"/><text x="195" y="227">충북</text><text class="count" x="195" y="243"></text></g>
<g class="kr-region" data-region="충남"><polygon points="90,185 158,184 150,252 123,286 78,260 65,215"/><text x="112" y="232">충남</text><text class="count" x="112" y="248"></text></g>
<g class="kr-region" data-region="세종"><polygon points="142,210 159,208 163,229 146,235"/><text x="152" y="224">세종</text></g>
<g class="kr-region" data-region="대전"><polygon points="138,250 160,244 170,262 151,276 135,267"/><text x="152" y="263">대전</text></g>
<g class="kr-region" data-region="경북"><polygon points="222,212 288,190 310,255 294,330 244,352 210,304 214,267"/><text x="262" y="272">경북</text><text class="count" x="262" y="288"></text></g>
<g class="kr-region" data-region="대구"><polygon points="239,303 259,294 272,310 261,329 240,325"/><text x="255" y="316">대구</text></g>
<g class="kr-region" data-region="전북"><polygon points="88,285 148,278 206,288 212,326 177,356 111,346 76,320"/><text x="143" y="320">전북</text><text class="count" x="143" y="336"></text></g>
<g class="kr-region" data-region="경남"><polygon points="180,354 242,344 286,362 280,427 241,455 182,432 155,390"/><text x="220" y="397">경남</text><text class="count" x="220" y="413"></text></g>
<g class="kr-region" data-region="울산"><polygon points="276,340 303,337 314,365 291,381 276,365"/><text x="296" y="359">울산</text></g>

<g class="kr-region" data-region="광주"><polygon points="95,388 117,381 129,397 116,414 94,408"/><text x="112" y="400">광주</text></g>

</svg></div><div class="card map-results"><h3 id="mapTitle">지도에서 지역을 선택하세요</h3><div class="muted" id="mapMeta">대한민국 시·도 단위로 검색됩니다.</div><div id="mapList" class="result-grid" style="grid-template-columns:1fr;margin-top:10px"></div></div></div></section>
<section id="tabStats" class="hidden"><div id="statsError"></div><div class="stat-cards"><div class="card bigstat"><span class="muted">재실 회원</span><strong id="stResidents">-</strong></div><div class="card bigstat"><span class="muted">프로필 등록</span><strong id="stProfiled">-</strong></div><div class="card bigstat"><span class="muted">등록 마릿수</span><strong id="stAnimals">-</strong></div><div class="card bigstat"><span class="muted">번식 경험자</span><strong id="stBreeders">-</strong></div></div><div class="profile-box" style="margin-top:10px"><div class="card section"><h3>지역별 회원</h3><div class="bars" id="regionBars"></div></div><div class="card section"><h3>보유종 TOP</h3><div class="bars" id="speciesBars"></div></div></div><div class="card section" style="margin-top:10px"><h3>관심종 TOP</h3><div class="bars" id="interestBars"></div><div class="note" id="statNote"></div></div></section>
<section id="detailPanel" class="card detail hidden" style="margin-top:12px"><div class="backline"><div class="muted" id="detailHint">회원 상세정보</div><button class="btn" id="detailClose">← 목록으로</button></div><div class="detail-head"><div class="avatar" id="detailAvatar">🐸</div><div><div class="detail-name" id="detailName">-</div><div class="muted" id="detailMeta"></div></div></div><div class="stats"><div class="card stat"><small>현재 순위</small><strong id="dRank">-</strong></div><div class="card stat"><small>시즌점수</small><strong id="dSeason">-</strong></div><div class="card stat"><small>누적점수</small><strong id="dLife">-</strong></div><div class="card stat"><small>출석</small><strong id="dAtt">-</strong></div><div class="card stat"><small>오운완</small><strong id="dWork">-</strong></div></div><div class="profile-box"><div class="card section"><h3>사육자 프로필</h3><div id="profileInfo" class="species"></div></div><div class="card section"><h3>보유종</h3><div id="detailSpecies" class="species"></div></div></div><div class="card section" style="margin-top:10px"><h3>활동 정보</h3><div id="activityInfo" class="chips"></div></div></section>
</main></div>
<script>
(()=>{
const APP=(window.NW_CONFIG&&window.NW_CONFIG.appScriptUrl)||'', $=id=>document.getElementById(id), fmt=n=>Number(n||0).toLocaleString('ko-KR');
function jsonp(action,params={}){return new Promise(resolve=>{if(!APP){resolve({ok:false,error:'Apps Script URL 설정 필요'});return;}const cb='nwm_'+Date.now()+'_'+Math.random().toString(36).slice(2);let done=false;const finish=d=>{if(done)return;done=true;try{resolve(d)}finally{delete window[cb];document.getElementById(cb)?.remove()}};window[cb]=finish;const q=new URLSearchParams({action,callback:cb,_:Date.now(),...params});const s=document.createElement('script');s.id=cb;s.src=APP+(APP.includes('?')?'&':'?')+q;s.onerror=()=>finish({ok:false,error:'서버 연결 실패'});document.body.appendChild(s);setTimeout(()=>finish({ok:false,error:'서버 응답시간 초과'}),15000);});}
function device(){return localStorage.getItem('nwProfileDevice')||''}function token(){return localStorage.getItem('nwProfileToken')||''}
$('closeBtn').onclick=()=>{if(window.parent!==window)window.parent.postMessage('nw-close-page','*');else history.back()};$('authBtn').onclick=()=>location.href='profile.html';
function requireAuth(d){if(d?.auth===false||(!d?.ok&&/로그인|인증/.test(d?.error||''))){$('app').classList.add('hidden');$('gate').classList.remove('hidden');return false}return true}
async function boot(){const t=token(),dev=device();if(!t||!dev){$('gate').classList.remove('hidden');return}const d=await jsonp('profileData',{token:t,device:dev});if(!d?.ok||!d.auth){$('gate').classList.remove('hidden');return}$('app').classList.remove('hidden');bind();const memberId=new URLSearchParams(location.search).get('member');if(memberId){$('app').classList.add('detail-only');$('detailPanel').classList.remove('hidden');$('detailName').textContent='불러오는 중…';await openDetail(memberId,true);return}await Promise.all([search(),loadStats()]);}
let bound=false,statsCache=null;
function bind(){if(bound)return;bound=true;$('searchBtn').onclick=search;['q','species'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')search()}));$('region').onchange=search;$('breeding').onchange=search;$('detailClose').onclick=()=>{if($('app').classList.contains('detail-only')){history.back();return}$('detailPanel').classList.add('hidden')};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));}
function setTab(t){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$('tabSearch').classList.toggle('hidden',t!=='search');$('tabMap').classList.toggle('hidden',t!=='map');$('tabStats').classList.toggle('hidden',t!=='stats');}
async function search(extra={}){$('searchError').innerHTML='';const d=await jsonp('memberDirectory',{token:token(),device:device(),q:$('q').value.trim(),region:extra.region??$('region').value,species:$('species').value.trim(),breeding:$('breeding').value});if(!requireAuth(d))return;if(!d?.ok){$('searchError').innerHTML='<div class="error">'+esc(d?.error||'검색 실패')+'</div>';return}$('count').textContent='검색 결과 '+d.count+'명';renderMembers($('results'),d.members||[]);return d.members||[]}
function renderMembers(el,arr){el.innerHTML=arr.length?arr.map(m=>`<article class="card member" data-id="${escAttr(m.memberId)}"><h3>${esc(m.nickname)}</h3><div class="muted">${m.role!=='회원'?esc(m.role)+' · ':''}${m.rank?m.rank+'위 · ':''}${esc(m.grade||'미획득')}</div><div class="chips">${m.hasProfile?'<span class="chip profiled">프로필 등록</span>':''}${m.region?`<span class="chip">📍 ${esc(m.region)}${m.district?' '+esc(m.district):''}</span>`:''}${(m.species||[]).slice(0,4).map(s=>`<span class="chip">${esc(s.name)}${s.count!=null?' '+fmt(s.count)+'마리':''}</span>`).join('')}${m.breeding?`<span class="chip">번식 ${esc(m.breeding)}</span>`:''}</div>${m.intro?`<div class="muted" style="margin-top:9px">${esc(m.intro)}</div>`:''}</article>`).join(''):'<div class="empty">조건에 맞는 회원이 없습니다.</div>';el.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>openDetail(x.dataset.id,false));}
async function openDetail(id,fromQuery=false){const d=await jsonp('memberDetail',{token:token(),device:device(),memberId:id});if(!requireAuth(d))return;if(!d?.ok){$('detailName').textContent='불러오기 실패';$('profileInfo').innerHTML='<div class="error">'+esc(d?.error||'회원 상세정보를 불러오지 못했습니다.')+'</div>';return}const m=d.member,p=m.profile||{};$('detailName').textContent=m.nickname;$('detailMeta').textContent=[m.role,m.grade,p.region,p.district].filter(Boolean).join(' · ')||'공개 프로필 미등록';$('dRank').textContent=m.role!=='회원'?'운영진':(m.rank?m.rank+'위':'-');$('dSeason').textContent=fmt(m.seasonScore)+'점';$('dLife').textContent=fmt(m.lifetimeScore)+'점';$('dAtt').textContent=fmt(m.attendance)+'회';$('dWork').textContent=fmt(m.workoutCount)+'회';$('detailAvatar').innerHTML=p.imageUrl?`<img src="${escAttr(p.imageUrl)}" alt="">`:'🐸';const infos=[];if(p.region)infos.push(['지역',p.region+(p.district?' '+p.district:'')]);if(p.keepingYears)infos.push(['사육경력',p.keepingYears]);if(p.breeding)infos.push(['번식경험',p.breeding]);if(p.interests)infos.push(['관심종',p.interests]);if(p.intro)infos.push(['한줄소개',p.intro]);$('profileInfo').innerHTML=infos.length?infos.map(x=>`<div class="sp"><b>${x[0]}</b><span>${esc(x[1])}</span></div>`).join(''):'<div class="muted">공개된 프로필 정보가 없습니다.</div>';$('detailSpecies').innerHTML=(p.species||[]).length?p.species.map(s=>`<div class="sp"><b>${esc(s.name)}</b><span>${s.count==null?'마릿수 비공개':fmt(s.count)+'마리'}</span></div>`).join(''):'<div class="muted">공개된 보유종 정보가 없습니다.</div>';$('activityInfo').innerHTML=[`채팅 ${fmt(m.chat)}`,`사진 ${fmt(m.photo)}`,`영상 ${fmt(m.video)}`,`소개 ${fmt(m.intro)}`,`출석 ${fmt(m.attendance)}`].map(x=>`<span class="chip">${x}</span>`).join('');$('detailPanel').classList.remove('hidden');if(!fromQuery){$('detailPanel').scrollIntoView({behavior:'smooth',block:'start'})}}
async function loadStats(){$('statsError').innerHTML='';const d=await jsonp('memberStats',{token:token(),device:device()});if(!requireAuth(d))return;if(!d?.ok){$('statsError').innerHTML='<div class="error">'+esc(d?.error||'통계를 불러오지 못했습니다.')+'</div>';return}statsCache=d.stats;renderStats(d.stats);renderMap(d.stats.regions||[])}
function renderStats(s){$('stResidents').textContent=fmt(s.residents)+'명';$('stProfiled').textContent=fmt(s.profiled)+'명 · '+s.profileRate+'%';$('stAnimals').textContent=fmt(s.totalAnimals)+'마리';$('stBreeders').textContent=fmt(s.breeders)+'명';renderBars($('regionBars'),s.regions||[],x=>x.count,'명');renderBars($('speciesBars'),(s.species||[]).slice(0,15),x=>x.keepers,'명');renderBars($('interestBars'),(s.interests||[]).slice(0,15),x=>x.count,'명');$('statNote').textContent=s.note||''}
function renderBars(el,arr,valFn,unit){const max=Math.max(1,...arr.map(valFn));el.innerHTML=arr.length?arr.map(x=>`<div class="barrow"><span>${esc(x.name)}</span><div class="bar"><i style="width:${valFn(x)/max*100}%"></i></div><b>${fmt(valFn(x))}${unit}</b></div>`).join(''):'<div class="muted">등록된 정보가 없습니다.</div>'}
function renderMap(regions){const cnt=Object.fromEntries(regions.map(x=>[x.name,x.count]));document.querySelectorAll('.kr-region').forEach(g=>{const name=g.dataset.region;const t=g.querySelector('.count');if(t)t.textContent=(cnt[name]||0)+'명';g.onclick=()=>mapRegion(name,g)})}
async function mapRegion(name,node){document.querySelectorAll('.kr-region').forEach(x=>x.classList.remove('active'));node?.classList.add('active');$('mapTitle').textContent='📍 '+name;$('mapMeta').textContent='해당 지역의 공개 프로필 회원';const d=await jsonp('memberDirectory',{token:token(),device:device(),region:name});if(!requireAuth(d))return;if(!d?.ok){$('mapList').innerHTML='<div class="error">'+esc(d?.error||'지역 검색 실패')+'</div>';return}renderMembers($('mapList'),d.members||[])}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escAttr(s){return esc(s)}
boot();
})();
</script></body></html>
