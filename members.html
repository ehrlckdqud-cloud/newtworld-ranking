<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071018">
<title>뉴트월드 회원 찾기</title><script src="site-config.js"></script>
<style>
:root{--bg:#071018;--panel:#0d1a23ee;--line:#294758;--text:#eff8ff;--muted:#8faebd;--green:#66d7a8;--blue:#67b7ff;--gold:#f3c35f;--red:#ff7a82}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(#071018,#08131a 60%,#061018);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif}body{padding:18px}.shell{max-width:1180px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.title{font-size:24px;font-weight:900}.muted{color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);background:#0e1d27;color:#edf8ff;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}.btn.primary{background:#0f4e43;border-color:#348c77}.btn:hover{border-color:#5fbea3;transform:translateY(-1px)}.card{background:linear-gradient(180deg,rgba(14,28,38,.97),rgba(8,17,24,.97));border:1px solid var(--line);border-radius:17px;box-shadow:0 16px 40px rgba(0,0,0,.22)}.gate{max-width:650px;margin:80px auto;padding:26px;text-align:center}.gate h2{font-size:26px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.tabs button.active{background:#154f48;border-color:#57bea2}.panel{padding:16px}.filters{display:grid;grid-template-columns:1.2fr .7fr 1fr .7fr auto;gap:8px}.filters input,.filters select{padding:11px 12px;border:1px solid #294758;border-radius:10px;background:#08141c;color:#fff}.result-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.member{padding:14px;cursor:pointer;transition:.16s}.member:hover{transform:translateY(-2px);border-color:#4f9d89}.member h3{margin:0 0 6px;font-size:16px}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.chip{font-size:10px;padding:4px 7px;border:1px solid #315466;border-radius:999px;color:#b9dce9;background:#0d2631}.empty{padding:24px;text-align:center;color:#83a2b0}.detail{padding:19px}.detail-head{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}.avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#f0c066,#b96127);font-size:36px}.detail-name{font-size:28px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:14px 0}.stat{padding:12px}.stat small{color:#88aaba}.stat strong{display:block;font-size:22px;margin-top:4px}.profile-box{display:grid;grid-template-columns:1fr 1fr;gap:10px}.section{padding:15px}.section h3{margin:0 0 10px}.species{display:grid;gap:6px}.sp{display:flex;justify-content:space-between;padding:8px 10px;border:1px solid #223d4b;border-radius:9px;background:#081821}.kmap-wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.kmap{position:relative;min-height:610px;background:radial-gradient(ellipse at 50% 45%,rgba(63,117,105,.23),transparent 54%),linear-gradient(180deg,#0a1720,#08131a);overflow:hidden}.peninsula{position:absolute;left:30%;top:5%;width:42%;height:88%;background:linear-gradient(180deg,rgba(42,94,78,.38),rgba(22,68,64,.25));clip-path:polygon(56% 0,68% 8%,66% 19%,80% 30%,72% 42%,78% 57%,62% 69%,55% 83%,43% 100%,29% 87%,33% 70%,19% 58%,24% 42%,13% 29%,28% 17%,39% 5%);border:1px solid #4b8975}.region-btn{position:absolute;transform:translate(-50%,-50%);padding:7px 8px;border-radius:999px;border:1px solid #467266;background:#0c2d2a;color:#eafff7;font-size:10px;font-weight:900;cursor:pointer;white-space:nowrap}.region-btn:hover{background:#176052}.map-results{padding:15px;max-height:610px;overflow:auto}.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.bigstat{padding:16px}.bigstat strong{display:block;font-size:26px;margin-top:5px}.bars{display:grid;gap:8px;margin-top:10px}.barrow{display:grid;grid-template-columns:130px 1fr 70px;gap:8px;align-items:center;font-size:12px}.bar{height:9px;background:#20303a;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#59bfff,#58d09f);border-radius:99px}.note{padding:11px 13px;border-radius:11px;background:#292411;border:1px solid #5f5427;color:#eadb91;font-size:11px;line-height:1.6;margin-top:12px}.hidden{display:none!important}
@media(max-width:900px){body{padding:10px}.result-grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.filters input:first-child{grid-column:1/-1}.kmap-wrap{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.stats .stat:last-child{grid-column:1/-1}.profile-box{grid-template-columns:1fr}.stat-cards{grid-template-columns:repeat(2,1fr)}.kmap{min-height:560px}}@media(max-width:560px){.result-grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.filters input:first-child{grid-column:auto}.barrow{grid-template-columns:90px 1fr 55px}.title{font-size:20px}}
</style>
</head>
<body><div class="shell">
<div class="top"><div><div class="title">🔎 뉴트월드 회원 찾기</div><div class="muted">회원식별 로그인을 완료한 재실 회원 전용 기능</div></div><button class="btn" id="closeBtn">닫기</button></div>
<section id="gate" class="card gate hidden"><h2>🔒 회원 전용 기능입니다</h2><p class="muted" style="line-height:1.8">회원 상세보기 · 보유종/마릿수 · 지역 검색 · 지역 지도 · 종별 통계는 회원식별 인증 후 이용할 수 있습니다.</p><button class="btn primary" id="authBtn">내 페이지에서 회원 인증하기</button></section>
<main id="app" class="hidden">
<div class="tabs"><button class="btn active" data-tab="search">회원 검색</button><button class="btn" data-tab="map">지역 지도</button><button class="btn" data-tab="stats">통계</button></div>
<section id="tabSearch" class="card panel"><div class="filters"><input id="q" placeholder="닉네임 검색"><select id="region"><option value="">전체 지역</option><option>서울</option><option>부산</option><option>대구</option><option>인천</option><option>광주</option><option>대전</option><option>울산</option><option>세종</option><option>경기</option><option>강원</option><option>충북</option><option>충남</option><option>전북</option><option>전남</option><option>경북</option><option>경남</option><option>제주</option></select><input id="species" placeholder="보유종 부분검색"><select id="breeding"><option value="">번식경험 전체</option><option>없음</option><option>있음</option><option>현재 번식 중</option></select><button class="btn primary" id="searchBtn">검색</button></div><div class="muted" id="count" style="margin-top:10px"></div><div id="results" class="result-grid"></div></section>
<section id="tabMap" class="hidden"><div class="kmap-wrap"><div class="card kmap" id="kmap"><div class="peninsula"></div></div><div class="card map-results"><h3 id="mapTitle">지역을 선택하세요</h3><div class="muted" id="mapMeta"></div><div id="mapList" class="result-grid" style="grid-template-columns:1fr;margin-top:10px"></div></div></div></section>
<section id="tabStats" class="hidden"><div class="stat-cards"><div class="card bigstat"><span class="muted">재실 회원</span><strong id="stResidents">-</strong></div><div class="card bigstat"><span class="muted">프로필 등록</span><strong id="stProfiled">-</strong></div><div class="card bigstat"><span class="muted">등록 마릿수</span><strong id="stAnimals">-</strong></div><div class="card bigstat"><span class="muted">번식 경험자</span><strong id="stBreeders">-</strong></div></div><div class="profile-box" style="margin-top:10px"><div class="card section"><h3>지역별 회원</h3><div class="bars" id="regionBars"></div></div><div class="card section"><h3>보유종 TOP</h3><div class="bars" id="speciesBars"></div></div></div><div class="card section" style="margin-top:10px"><h3>관심종 TOP</h3><div class="bars" id="interestBars"></div><div class="note" id="statNote"></div></div></section>
<section id="detailPanel" class="card detail hidden" style="margin-top:12px"><div style="display:flex;justify-content:flex-end"><button class="btn" id="detailClose">상세 닫기</button></div><div class="detail-head"><div class="avatar" id="detailAvatar">🐸</div><div><div class="detail-name" id="detailName">-</div><div class="muted" id="detailMeta"></div></div></div><div class="stats"><div class="card stat"><small>현재 순위</small><strong id="dRank">-</strong></div><div class="card stat"><small>시즌점수</small><strong id="dSeason">-</strong></div><div class="card stat"><small>누적점수</small><strong id="dLife">-</strong></div><div class="card stat"><small>출석</small><strong id="dAtt">-</strong></div><div class="card stat"><small>오운완</small><strong id="dWork">-</strong></div></div><div class="profile-box"><div class="card section"><h3>사육자 프로필</h3><div id="profileInfo" class="species"></div></div><div class="card section"><h3>보유종</h3><div id="detailSpecies" class="species"></div></div></div><div class="card section" style="margin-top:10px"><h3>활동 정보</h3><div id="activityInfo" class="chips"></div></div></section>
</main></div>
<script>
(()=>{
const APP=(window.NW_CONFIG&&window.NW_CONFIG.appScriptUrl)||'', $=id=>document.getElementById(id), fmt=n=>Number(n||0).toLocaleString('ko-KR');
function jsonp(action,params={}){return new Promise(resolve=>{if(!APP){resolve({ok:false,error:'Apps Script URL 설정 필요'});return;}const cb='nwm_'+Date.now()+'_'+Math.random().toString(36).slice(2);window[cb]=d=>{try{resolve(d)}finally{delete window[cb];document.getElementById(cb)?.remove()}};const q=new URLSearchParams({action,callback:cb,_:Date.now(),...params});const s=document.createElement('script');s.id=cb;s.src=APP+(APP.includes('?')?'&':'?')+q;s.onerror=()=>resolve({ok:false,error:'서버 연결 실패'});document.body.appendChild(s);});}
function device(){return localStorage.getItem('nwProfileDevice')||''}function token(){return localStorage.getItem('nwProfileToken')||''}
$('closeBtn').onclick=()=>{if(window.parent!==window)window.parent.postMessage('nw-close-page','*');else history.back()};$('authBtn').onclick=()=>location.href='profile.html';
function requireAuth(d){if(d?.auth===false||(!d?.ok&&/로그인|인증/.test(d?.error||''))){$('app').classList.add('hidden');$('gate').classList.remove('hidden');return false}return true}
async function boot(){const t=token(),dev=device();if(!t||!dev){$('gate').classList.remove('hidden');return}const d=await jsonp('profileData',{token:t,device:dev});if(!d?.ok||!d.auth){$('gate').classList.remove('hidden');return}$('app').classList.remove('hidden');bind();await Promise.all([search(),loadStats()]);const id=new URLSearchParams(location.search).get('member');if(id)openDetail(id);}
let bound=false,statsCache=null;
function bind(){if(bound)return;bound=true;$('searchBtn').onclick=search;['q','species'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')search()}));$('detailClose').onclick=()=>$('detailPanel').classList.add('hidden');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));}
function setTab(t){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$('tabSearch').classList.toggle('hidden',t!=='search');$('tabMap').classList.toggle('hidden',t!=='map');$('tabStats').classList.toggle('hidden',t!=='stats');}
async function search(extra={}){const d=await jsonp('memberDirectory',{token:token(),device:device(),q:$('q').value.trim(),region:extra.region??$('region').value,species:$('species').value.trim(),breeding:$('breeding').value});if(!requireAuth(d))return;if(!d?.ok){$('results').innerHTML='<div class="empty">'+(d?.error||'검색 실패')+'</div>';return}$('count').textContent='검색 결과 '+d.count+'명';renderMembers($('results'),d.members||[]);return d.members||[]}
function renderMembers(el,arr){el.innerHTML=arr.length?arr.map(m=>`<article class="card member" data-id="${m.memberId}"><h3>${esc(m.nickname)}</h3><div class="muted">${m.role!=='회원'?esc(m.role)+' · ':''}${m.rank?m.rank+'위 · ':''}${esc(m.grade||'미획득')}</div><div class="chips">${m.region?`<span class="chip">📍 ${esc(m.region)}${m.district?' '+esc(m.district):''}</span>`:''}${(m.species||[]).slice(0,3).map(s=>`<span class="chip">${esc(s.name)}${s.count!=null?' '+fmt(s.count):''}</span>`).join('')}</div></article>`).join(''):'<div class="empty">조건에 맞는 회원이 없습니다.</div>';el.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>openDetail(x.dataset.id));}
async function openDetail(id){const d=await jsonp('memberDetail',{token:token(),device:device(),memberId:id});if(!requireAuth(d))return;if(!d?.ok){alert(d?.error||'회원 상세정보를 불러오지 못했습니다.');return}const m=d.member,p=m.profile||{};$('detailName').textContent=m.nickname;$('detailMeta').textContent=[m.role,m.grade,p.region,p.district].filter(Boolean).join(' · ');$('dRank').textContent=m.role!=='회원'?'운영진':(m.rank?m.rank+'위':'-');$('dSeason').textContent=fmt(m.seasonScore)+'점';$('dLife').textContent=fmt(m.lifetimeScore)+'점';$('dAtt').textContent=fmt(m.attendance)+'회';$('dWork').textContent=fmt(m.workoutCount)+'회';$('detailAvatar').innerHTML=p.imageUrl?`<img src="${escAttr(p.imageUrl)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:'🐸';const infos=[];if(p.region)infos.push(['지역',p.region+(p.district?' '+p.district:'')]);if(p.keepingYears)infos.push(['사육경력',p.keepingYears]);if(p.breeding)infos.push(['번식경험',p.breeding]);if(p.interests)infos.push(['관심종',p.interests]);if(p.intro)infos.push(['한줄소개',p.intro]);$('profileInfo').innerHTML=infos.length?infos.map(x=>`<div class="sp"><b>${x[0]}</b><span>${esc(x[1])}</span></div>`).join(''):'<div class="muted">공개된 프로필 정보가 없습니다.</div>';$('detailSpecies').innerHTML=(p.species||[]).length?p.species.map(s=>`<div class="sp"><b>${esc(s.name)}</b><span>${s.count==null?'마릿수 비공개':fmt(s.count)+'마리'}</span></div>`).join(''):'<div class="muted">공개된 보유종 정보가 없습니다.</div>';$('activityInfo').innerHTML=[`채팅 ${fmt(m.chat)}`,`사진 ${fmt(m.photo)}`,`영상 ${fmt(m.video)}`,`소개 ${fmt(m.intro)}`,`출석 ${fmt(m.attendance)}`].map(x=>`<span class="chip">${x}</span>`).join('');$('detailPanel').classList.remove('hidden');$('detailPanel').scrollIntoView({behavior:'smooth',block:'start'});}
async function loadStats(){const d=await jsonp('memberStats',{token:token(),device:device()});if(!requireAuth(d)||!d?.ok)return;statsCache=d.stats;renderStats(d.stats);renderMap(d.stats.regions||[])}
function renderStats(s){$('stResidents').textContent=fmt(s.residents)+'명';$('stProfiled').textContent=fmt(s.profiled)+'명 · '+s.profileRate+'%';$('stAnimals').textContent=fmt(s.totalAnimals)+'마리';$('stBreeders').textContent=fmt(s.breeders)+'명';renderBars($('regionBars'),s.regions||[],x=>x.count,'명');renderBars($('speciesBars'),(s.species||[]).slice(0,15),x=>x.keepers,'명');renderBars($('interestBars'),(s.interests||[]).slice(0,15),x=>x.count,'명');$('statNote').textContent=s.note||''}
function renderBars(el,arr,valFn,unit){const max=Math.max(1,...arr.map(valFn));el.innerHTML=arr.length?arr.map(x=>`<div class="barrow"><span>${esc(x.name)}</span><div class="bar"><i style="width:${valFn(x)/max*100}%"></i></div><b>${fmt(valFn(x))}${unit}</b></div>`).join(''):'<div class="muted">등록된 정보가 없습니다.</div>'}
const regionPos={서울:[47,31],부산:[66,76],대구:[62,60],인천:[38,31],광주:[43,72],대전:[50,50],울산:[70,66],세종:[48,43],경기:[48,25],강원:[63,22],충북:[55,43],충남:[39,49],전북:[47,61],전남:[39,78],경북:[65,49],경남:[58,72],제주:[32,93]};
function renderMap(regions){const map=$('kmap');map.querySelectorAll('.region-btn').forEach(x=>x.remove());const cnt=Object.fromEntries(regions.map(x=>[x.name,x.count]));Object.entries(regionPos).forEach(([name,pos])=>{const b=document.createElement('button');b.className='region-btn';b.style.left=pos[0]+'%';b.style.top=pos[1]+'%';b.textContent=name+' '+(cnt[name]||0);b.onclick=()=>mapRegion(name);map.appendChild(b)})}
async function mapRegion(name){$('mapTitle').textContent='📍 '+name;$('mapMeta').textContent='해당 지역의 공개 프로필 회원';const d=await jsonp('memberDirectory',{token:token(),device:device(),region:name});if(!d?.ok)return;renderMembers($('mapList'),d.members||[])}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escAttr(s){return esc(s)}
boot();
})();
</script></body></html>
