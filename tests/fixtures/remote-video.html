<!doctype html><meta charset="utf-8"><title>Coop media regression</title><style>[hidden]{display:none!important}body{background:#123;color:white;font:18px system-ui}video,canvas{width:304px}#wrap{position:relative;width:304px}#loading{position:absolute;inset:0;background:black}</style><button id="run">영상 연결 검사 시작</button><button id="local">영상 재생 상태 검사</button><p id="status">대기</p><canvas id="canvas" width="304" height="224"></canvas><div id="wrap" hidden><video id="video" autoplay muted playsinline></video><div id="loading">로딩 중</div></div><pre id="report"></pre>
<script type="module">
import {attachRemoteVideo,syncVideoLoading} from '../../coop/remote-video.mjs';
const $=id=>document.getElementById(id);$('run').onclick=async()=>{const host=new RTCPeerConnection(),guest=new RTCPeerConnection();let ack=false,frames=0,decoded=0,channel;const pending=[[],[]];const pcs=[host,guest];pcs.forEach((pc,i)=>pc.onicecandidate=e=>{if(e.candidate){const other=pcs[1-i];if(other.remoteDescription)other.addIceCandidate(e.candidate);else pending[1-i].push(e.candidate);}});const receive=guest.ondatachannel=e=>{channel=e.channel;channel.onopen=()=>{if(decoded)channel.send('media-ready');};};host.createDataChannel('input',{ordered:false,maxRetransmits:0}).onmessage=e=>{if(e.data==='media-ready')ack=true;};guest.ontrack=e=>attachRemoteVideo($('video'),e.streams[0],{loading:$('loading'),onReady:()=>{decoded++;if(channel?.readyState==='open')channel.send('media-ready');},onError:e=>$('status').textContent='FAIL '+e.message});const ctx=$('canvas').getContext('2d'),paint=setInterval(()=>{ctx.fillStyle=frames%2?'#246':'#284';ctx.fillRect(0,0,304,224);ctx.fillStyle='white';ctx.font='24px sans-serif';ctx.fillText('FRAME '+(++frames),35,110);},50);const media=$('canvas').captureStream(20);for(const t of media.getTracks())host.addTrack(t,media);
// Use the sender's stream identity supplied with its actual captured track.
await host.setLocalDescription(await host.createOffer());await guest.setRemoteDescription(host.localDescription);for(const c of pending[1])await guest.addIceCandidate(c);await guest.setLocalDescription(await guest.createAnswer());await host.setRemoteDescription(guest.localDescription);for(const c of pending[0])await host.addIceCandidate(c);const deadline=Date.now()+10000;while(!ack&&Date.now()<deadline)await new Promise(r=>setTimeout(r,100));$('wrap').hidden=false;$('loading').hidden=false;const visible=syncVideoLoading($('video'),$('loading'));await new Promise(r=>setTimeout(r,1500));const received=$('video').getVideoPlaybackQuality().totalVideoFrames;$('status').textContent=ack&&visible&&received>1?'PASS — 영상 수신 후 시작해도 로딩 화면 없음':'FAIL';$('report').textContent=JSON.stringify({localCandidates:(host.localDescription?.sdp.match(/a=candidate:/g)||[]).length,remoteCandidates:(guest.localDescription?.sdp.match(/a=candidate:/g)||[]).length,gathering:host.iceGatheringState,input:channel?.readyState,host:host.connectionState,guest:guest.connectionState,mediaAcknowledged:ack,decoded,receivedFrames:received,loadingHidden:$('loading').hidden},null,2);clearInterval(paint);};
</script>
<script type="module">
import {attachRemoteVideo,syncVideoLoading} from '../../coop/remote-video.mjs';
const $=id=>document.getElementById(id);$('local').onclick=async()=>{let decoded=false,n=0;const ctx=$('canvas').getContext('2d'),timer=setInterval(()=>{ctx.fillStyle='#246';ctx.fillRect(0,0,304,224);ctx.fillStyle='white';ctx.font='24px sans-serif';ctx.fillText('FRAME '+(++n),30,110);},50);attachRemoteVideo($('video'),$('canvas').captureStream(20),{loading:$('loading'),onReady:()=>decoded=true});const deadline=Date.now()+5000;while(!decoded&&Date.now()<deadline)await new Promise(r=>setTimeout(r,100));const preflight=decoded;$('wrap').hidden=false;$('loading').hidden=false;syncVideoLoading($('video'),$('loading'));await new Promise(r=>setTimeout(r,500));$('status').textContent=preflight&&$('loading').hidden?'PASS — 재생 중인 영상 위에 로딩 화면이 다시 나타나지 않음':'FAIL';$('report').textContent=JSON.stringify({decodedBeforeGameStart:preflight,loadingHidden:$('loading').hidden,videoWidth:$('video').videoWidth,receivedFrames:$('video').getVideoPlaybackQuality().totalVideoFrames},null,2);clearInterval(timer);};
</script>
