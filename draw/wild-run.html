<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>양서파충류 달리기 대회 · 뉴트월드</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#10231d;color:#f1eedb;font:16px system-ui}main{width:min(92vw,380px);padding:24px}h1{font-size:26px}label,input,button,a{display:block;margin:12px 0}input,button{font:inherit;padding:12px;width:100%;border-radius:8px;border:1px solid #739787}button{background:#c4daa4;cursor:pointer}a{color:#dcdbb8}</style>
<main><h1>양서파충류 달리기 대회<br><small>(개발 중)</small></h1><form method="post" action="https://newtworld-ms3-coop-5p.ehrlckdqud.chatgpt.site/wild-run-91/enter"><label for="pin">게임 입장 비밀번호</label><input id="pin" name="password" type="password" required autofocus inputmode="numeric"><input type="hidden" name="token"><input type="hidden" name="device"><button>입장</button></form><p role="status"></p><a href="../index.html#draw">생존 추첨으로 돌아가기</a></main>
<script>const form=document.querySelector('form');function credentials(){for(const [field,key] of [['token','nwProfileToken'],['device','nwProfileDevice']])form.elements[field].value=localStorage.getItem(key)||'';const ok=!!(form.elements.token.value&&form.elements.device.value);if(!ok){form.hidden=true;document.querySelector('[role=status]').textContent='뉴트월드 내 페이지에서 회원식별 후 입장해주세요.'}return ok}credentials();form.onsubmit=e=>{if(!credentials())e.preventDefault()};</script></html>
