<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>뉴트월드 1~5인 협동 테스트</title><link rel="stylesheet" href="./style.css">
<header><a href="../index.html">← 뉴트월드</a><strong>NEWTWORLD</strong><span>1~5인 협동 · 개발 검증본</span></header>
<main><section class="game"><p>5인 메인 경로 완주 검증 완료 · 실제 외부 PC 연결은 검증 중입니다. 뉴트젬은 사용하지 않습니다.</p>
<form id="joinForm"><label>회원 <input id="name" maxlength="20" readonly required></label><label>초대 코드 <input id="invite"></label><button id="create" type="button">방 만들기</button><button>입장</button></form>
<p id="code"></p><div id="players"></div><div id="controls" hidden><label>캐릭터 <select id="character"><option value="0">Marco</option><option value="1">Tarma</option><option value="2">Eri</option><option value="3">Fio</option></select></label><button id="ready">준비</button><button id="select">컨티뉴 캐릭터 선택</button><button id="sound">소리 켜기</button><button id="full">전체화면</button></div>

<aside><h2>채팅</h2><ol id="messages" aria-live="polite"></ol><form id="chatForm" hidden><input id="chat" maxlength="120" aria-label="채팅 메시지"><button>전송</button></form></aside></main>
